<div class="login-container">
  <div class="login-card">
    
    <div class="brand-header">
      <div class="brand-logo">TI</div>
      <div class="brand-text">
        <h1>Tax Inspection</h1>
        <p>Secure access portal</p>
      </div>
    </div>

    <h2 class="form-title">Sign in</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          [class.is-invalid]="isFieldInvalid('email')"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          [class.is-invalid]="isFieldInvalid('password')"
        />
      </div>

      <div class="form-group role-group">
        <span>Role</span>
        <label class="radio-option">
          <input type="radio" formControlName="role" value="Field Officer" />
          Field Officer
        </label>
        <label class="radio-option">
          <input type="radio" formControlName="role" value="Admin" />
          Admin
        </label>
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="btn-submit"
      >
        Sign in
      </button>
    </form>

    <p class="footer-text">
      Don't have an account? 
      <a routerLink="/signup" class="link-create-account">Create account</a>
    </p>

  </div>
</div>
