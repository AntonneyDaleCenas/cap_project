<div class="login-container">
  <div class="login-brand-panel" aria-label="City tax inspection portal">
    <img class="city-seal" src="cdo.png" alt="City of Cagayan de Oro seal" />
    <div class="brand-panel-copy">
      <strong>City Tax Inspection</strong>
      <span>Official access portal</span>
    </div>
  </div>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-text">
        <h1>Sign in</h1>
        <p>Use your account credentials</p>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" autocomplete="off">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="off"
          placeholder="you@example.com"
          [class.is-invalid]="isFieldInvalid('email')"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="off"
          placeholder="••••••••"
          [class.is-invalid]="isFieldInvalid('password')"
        />
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="btn-submit"
      >
        Login
      </button>
    </form>

    <div class="forgot-password-block" *ngIf="showForgotPassword">
      <h3>Reset password</h3>
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="resetPassword()" class="forgot-password-form" autocomplete="off">
        <div class="form-group">
          <label for="reset-email">Email</label>
          <input id="reset-email" type="email" formControlName="email" autocomplete="off" [class.is-invalid]="isForgotFieldInvalid('email')" placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label for="new-password">New password</label>
          <input id="new-password" type="password" formControlName="newPassword" autocomplete="off" [class.is-invalid]="isForgotFieldInvalid('newPassword')" placeholder="••••••••" />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" type="password" formControlName="confirmPassword" autocomplete="off" [class.is-invalid]="isForgotFieldInvalid('confirmPassword') || forgotPasswordForm.hasError('passwordsMismatch')" placeholder="••••••••" />
        </div>

        <div class="forgot-password-actions">
          <button type="submit" class="btn-submit small" [disabled]="forgotPasswordForm.invalid">Update password</button>
          <button type="button" class="btn-secondary" (click)="toggleForgotPassword()">Cancel</button>
        </div>
      </form>
    </div>

    <p class="footer-text">
      <button type="button" class="link-button" (click)="toggleForgotPassword()">
        {{ showForgotPassword ? 'Close reset form' : 'Forgot password?' }}
      </button>
    </p>

    <p class="footer-text">
      Don't have an account? 
      <a routerLink="/signup" class="link-create-account">Create account</a>
    </p>

  </div>
</div>
