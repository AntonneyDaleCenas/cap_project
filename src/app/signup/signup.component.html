<div class="login-container">
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo">TI</div>
      <div class="brand-text">
        <h1>Tax Inspection</h1>
        <p>Create your account</p>
      </div>
    </div>

    <h2 class="form-title">Sign up</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="firstName">First name</label>
        <input id="firstName" type="text" formControlName="firstName" placeholder="Jane" />
      </div>

      <div class="form-group">
        <label for="lastName">Last name</label>
        <input id="lastName" type="text" formControlName="lastName" placeholder="Doe" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label for="employeeId">Employee ID</label>
        <input id="employeeId" type="text" formControlName="employeeId" placeholder="EMP123" />
      </div>

      <div class="form-group role-group">
        <span>Role</span>
        <label class="radio-option">
          <input type="radio" formControlName="role" value="Field Officer" />
          Field Officer
        </label>
        <label class="radio-option">
          <input type="radio" formControlName="role" value="Admin" />
          Admin
        </label>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="••••••••" />
      </div>

      <div class="form-group checkbox-row">
        <label>
          <input type="checkbox" formControlName="terms" />
          Accept terms and conditions
        </label>
      </div>

      <button type="submit" class="btn-submit" [disabled]="registerForm.invalid">
        Create account
      </button>
    </form>
  </div>
</div>
